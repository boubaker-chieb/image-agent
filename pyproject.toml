[project]
name = "image-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Boubaker Chieb", email = "boubaker.ch@outlook.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.10.1",
    "dotenv>=0.9.9",
    "isort>=9.0.2",
    "langchain>=1.5.0",
    "langchain-openai>=1.7.4",
    "openai>=3.49.0",
]

[project.scripts]
image-agent = "image_agent.cli:main"
image_agent = "image_agent.cli:main"

[build-system]
